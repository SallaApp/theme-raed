<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Theme Raed is now a React theme</title>
  <desc id="desc">This Twig repository, SallaApp/theme-raed, is deprecated. New themes start from SallaApp/theme-raed-react.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#005a69"/>
      <stop offset="1" stop-color="#00262e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.66" r="0.48">
      <stop offset="0" stop-color="#BAF3E6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#BAF3E6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#BAF3E6" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="420" rx="24"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.75; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>
  </g>

  <!-- Left: the message -->
  <g class="sans">
    <rect x="72" y="72" width="164" height="36" rx="18" fill="#FFB020" fill-opacity="0.14" stroke="#FFC24D" stroke-opacity="0.6"/>
    <circle class="pulse" cx="94" cy="90" r="5" fill="#FFC24D"/>
    <text x="108" y="95.5" font-size="15" font-weight="700" letter-spacing="2.2" fill="#FFC24D">DEPRECATED</text>

    <text x="70" y="190" font-size="72" font-weight="800" fill="#FFFFFF">Theme Raed</text>
    <text x="72" y="244" font-size="34" font-weight="600" fill="#BAF3E6">is now a React theme.</text>
    <text x="72" y="290" font-size="19" fill="#FFFFFF" fill-opacity="0.72">New themes start from Raed React on Twilight for React.</text>
  </g>
  <g>
    <rect x="72" y="314" width="262" height="46" rx="10" fill="#000000" fill-opacity="0.28" stroke="#BAF3E6" stroke-opacity="0.22"/>
    <text class="mono" x="92" y="343" font-size="18"><tspan fill="#BAF3E6">$</tspan><tspan fill="#FFFFFF" dx="10">salla theme create</tspan></text>
  </g>

  <!-- Right: from the Twig repository to the React one -->
  <g class="sans">
    <rect x="744" y="84" width="464" height="92" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2" stroke-dasharray="6 6"/>
    <rect x="768" y="104" width="58" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="797" y="120.5" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#9DBDC3">TWIG</text>
    <text x="1184" y="121" font-size="13" font-weight="600" text-anchor="end" fill="#FFC24D">deprecated</text>
    <text class="mono" x="768" y="158" font-size="22" fill="#9DBDC3" textLength="251" lengthAdjust="spacing">SallaApp/theme-raed</text>
    <line x1="766" y1="151" x2="1021" y2="151" stroke="#9DBDC3" stroke-width="2"/>
  </g>

  <line class="flow" x1="976" y1="186" x2="976" y2="230" stroke="#BAF3E6" stroke-width="3" stroke-linecap="round"/>
  <path d="M966 222 L976 233 L986 222" fill="none" stroke="#BAF3E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g class="sans">
    <rect class="pulse" x="744" y="244" width="464" height="112" rx="16" fill="#BAF3E6" filter="url(#soft)"/>
    <rect x="744" y="244" width="464" height="112" rx="16" fill="#BAF3E6"/>
    <rect x="768" y="264" width="72" height="24" rx="12" fill="#004956"/>
    <text x="804" y="280.5" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#BAF3E6">REACT</text>
    <text x="1184" y="281" font-size="13" font-weight="700" text-anchor="end" fill="#004956">start here →</text>
    <text class="mono" x="768" y="318" font-size="22" font-weight="700" fill="#004956" textLength="330" lengthAdjust="spacing">SallaApp/theme-raed-react</text>
    <text x="768" y="343" font-size="14" fill="#004956" fill-opacity="0.75">TanStack Start · Vite · server-rendered on Cloudflare Workers</text>
  </g>
</svg>
